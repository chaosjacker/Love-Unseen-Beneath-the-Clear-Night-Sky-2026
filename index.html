
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101a35">
<meta name="description" content="給快樂的一個小小星空，收藏她的畫、喜歡的動漫與音樂。">
<title>給快樂｜願你永遠被溫柔與星光擁抱</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23f3dba8'/%3E%3C/svg%3E">

<style>
:root{
  --night:#0b1228;
  --blue:#172746;
  --gold:#f3dba8;
  --cream:#fff8eb;
  --muted:#c5cce0;
  --pink:#e9b8c7;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 0%,#34466d 0%,transparent 48%),
    radial-gradient(ellipse at 12% 40%,#292447 0%,transparent 42%),
    radial-gradient(ellipse at 90% 65%,#253252 0%,transparent 38%),
    linear-gradient(180deg,#101a35 0%,#0b1228 55%,#070c1c 100%);
  background-attachment:fixed;
  color:var(--cream);
  font-family:Georgia,"Noto Serif TC","Songti TC",serif;
  line-height:1.8;
  overflow-x:hidden;
}

/* 星空 */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.45;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent 60%),
    radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent 60%),
    radial-gradient(1.5px 1.5px at 82% 68%,#f3dba8 50%,transparent 60%),
    radial-gradient(1px 1px at 35% 78%,#fff 50%,transparent 60%),
    radial-gradient(2px 2px at 55% 48%,#fff 50%,transparent 60%);
  background-size:240px 220px;
}

a{color:var(--gold)}
img{max-width:100%}

.skip{
  position:absolute;
  left:-9999px;
  top:0;
  z-index:99;
  background:var(--gold);
  color:var(--night);
  padding:8px 16px;
  border-radius:0 0 8px 0;
  text-decoration:none;
}
.skip:focus{left:0}

.wrap{
  width:min(1040px,calc(100% - 36px));
  margin:auto;
  position:relative;
  z-index:1;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 0;
  color:var(--muted);
  font-size:.9rem;
}
nav a{
  text-decoration:none;
  margin-left:18px;
}
nav a:hover{color:var(--gold)}

.hero{
  min-height:76vh;
  display:grid;
  place-items:center;
  text-align:center;
  padding:70px 0 90px;
}
.moon{
  width:76px;
  height:76px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 35px #f3dba866,0 0 100px #f3dba833;
  margin:0 auto 28px;
}
.eyebrow{
  letter-spacing:.28em;
  color:var(--gold);
  font-size:.78rem;
}
h1{
  font-size:clamp(3.4rem,10vw,6.8rem);
  font-weight:400;
  letter-spacing:.18em;
  margin:5px 0 12px;
}
.subtitle{
  font-size:clamp(1rem,3vw,1.35rem);
  letter-spacing:.12em;
  color:#f0dfc4;
}
.hero p{
  color:var(--muted);
  max-width:560px;
  margin:28px auto 0;
}
.scroll{
  margin-top:42px;
  color:var(--gold);
  font-size:.8rem;
  letter-spacing:.2em;
}

section{
  padding:72px 0;
  border-top:1px solid #ffffff18;
}
.section-head{
  text-align:center;
  margin-bottom:34px;
}
.section-head .eyebrow{font-size:.7rem}
h2{
  font-size:clamp(1.8rem,5vw,2.5rem);
  font-weight:400;
  color:var(--gold);
  margin:5px 0;
}
.intro{
  max-width:680px;
  margin:0 auto;
  text-align:center;
  color:var(--muted);
}

/* 畫作展示 */
.art-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
figure{margin:0}

.art{
  background:#ffffff0b;
  border:1px solid #ffffff20;
  padding:10px;
  border-radius:14px;
  transition:background .3s,border-color .3s;
  overflow:hidden;
}
.art:hover{
  background:#ffffff12;
  border-color:#ffffff35;
}
.art img{
  width:100%;
  height:290px;
  object-fit:cover;
  object-position:center bottom;
  border-radius:8px;
  display:block;
}
figcaption{
  color:var(--muted);
  font-size:.85rem;
  text-align:center;
  padding:10px 4px 2px;
}
figcaption b{
  display:block;
  color:#e6d6b6;
  font-weight:400;
  letter-spacing:.06em;
}

/* 動漫 */
.anime-card{
  display:grid;
  grid-template-columns:minmax(180px,300px) 1fr;
  gap:28px;
  align-items:center;
  max-width:760px;
  margin:auto;
  background:#ffffff0b;
  border:1px solid #ffffff20;
  border-radius:18px;
  padding:16px;
  overflow:hidden;
}
.anime-card img{
  width:100%;
  height:330px;
  object-fit:cover;
  object-position:center bottom;
  border-radius:12px;
  display:block;
}
.anime-card h3{
  color:var(--gold);
  font-size:1.5rem;
  font-weight:400;
  margin:0 0 10px;
}
.anime-card p{color:var(--muted)}
.anime-card .quote{
  font-size:.85rem;
  color:#e6d6b6;
}

/* 音樂 */
.music{
  max-width:700px;
  margin:auto;
  text-align:center;
  padding:30px;
  border:1px solid #ffffff25;
  border-radius:18px;
  background:linear-gradient(135deg,#ffffff0c,#ffffff04);
}
.sun{font-size:2.5rem}
.song{
  font-size:1.45rem;
  color:var(--gold);
  margin:8px 0 0;
}
.artist{
  color:var(--muted);
  margin:0;
}

/* 結語 */
.note{
  max-width:700px;
  margin:auto;
  text-align:center;
  font-size:1.15rem;
  color:#f1dfc5;
}
