<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Love Unseen Beneath the Clear Night Sky — 2026 Audio Novel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #060913;
    --card: rgba(255, 255, 255, 0.05);
    --line: rgba(255, 255, 255, 0.1);
    --line-hover: rgba(217, 199, 163, 0.5);
    --text: #f4f1ea;
    --muted: #aeb6c8;
    --accent: #d9c7a3;
  }
  
  *{ box-sizing: border-box; }
  
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 10% 10%, rgba(80, 110, 200, 0.2), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(217, 199, 163, 0.15), transparent 40%),
      radial-gradient(circle at 50% 80%, rgba(100, 70, 150, 0.15), transparent 50%);
    background-attachment: fixed;
    color: var(--text) !important; /* 強制白字 */
    font-family: "Noto Serif TC", "Shippori Mincho", serif;
    line-height: 1.9;
    letter-spacing: 0.05em;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 80px 24px 100px;
  }

  .hero {
    text-align: center;
    padding-bottom: 45px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 45px;
    position: relative;
  }
  
  .hero::before {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .eyebrow {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.3;
    font-weight: 400;
    margin: 0 0 16px;
    color: #ffffff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .subtitle {
    font-family: "Inter", sans-serif;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .jp {
    margin: 40px 0 20px;
    font-family: "Shippori Mincho", serif;
    font-size: clamp(18px, 2.8vw, 24px);
    color: #e8e2d6;
    text-shadow: 0 0 20px rgba(217, 199, 163, 0.2);
  }

  .zh-title {
    font-size: clamp(16px, 2.4vw, 19px);
    margin: 0 0 12px;
    color: #dfe3ec;
  }

  .edition {
    font-family: "Inter", sans-serif;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.15em;
  }

  blockquote {
    margin: 40px auto 0;
    padding: 20px 24px;
    max-width: 620px;
    border-left: 2px solid var(--accent);
    background: linear-gradient(90deg, rgba(217, 199, 163, 0.08), transparent);
    color: #efe9dd;
    font-size: 15px;
    text-align: left;
    border-radius: 0 8px 8px 0;
  }

  .grid {
    display: grid;
    gap: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: all 0.3s ease;
  }

  /* 電腦滑鼠移過去才有特效，手機不會觸發隱藏 */
  .card:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--line-hover);
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  }

  .lang {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .lang::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line-hover), transparent);
  }

  .card h2 {
    font-size: clamp(17px, 2.3vw, 20px);
    line-height: 1.6;
    font-weight: 500;
    margin: 0 0 12px;
    color: #ffffff;
  }

  .card p {
    margin: 0;
    color: #d1d9e6;
    font-size: 15px;
    line-height: 1.8;
  }

  .meta {
    margin-top: 20px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .flower {
    display: inline-block;
    margin-left: 0.4em;
  }

  @media (max-width: 560px){
    .wrap{ padding: 50px 20px 80px; }
    .card{ padding: 24px 20px; }
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="hero">
    <div class="eyebrow">2026 Audio Novel</div>
    <h1>Love Unseen Beneath<br />the Clear Night Sky</h1>
    <div class="subtitle">Audio Novel · 2026 Edition</div>

    <p class="jp">透明な夜に駆ける君と、目に見えない恋をした。</p>
    <p class="zh-title">與奔馳於透明之夜的你，赴一場看不見的愛戀</p>
    <div class="edition">有聲小說 2026 版</div>

    <blockquote>
      致那位明朗明媚、生命如夏花般絢爛盛放的女孩<span class="flower">🌸</span>
    </blockquote>
  </h
