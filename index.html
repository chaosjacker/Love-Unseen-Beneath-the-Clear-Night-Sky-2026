<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#060913" />
<title>Love Unseen Beneath the Clear Night Sky — 2026 Audio Novel</title>
<meta name="description" content="透明な夜に駆ける君と、目に見えない恋をした。2026 有聲小說版。" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #060913;
    --card: rgba(255, 255, 255, 0.045);
    --card-hover: rgba(255, 255, 255, 0.075);
    --line: rgba(255, 255, 255, 0.10);
    --line-hover: rgba(217, 199, 163, 0.50);
    --text: #f4f1ea;
    --text-soft: #dfe3ec;
    --muted: #aeb6c8;
    --accent: #d9c7a3;
    --accent-glow: rgba(217, 199, 163, 0.35);
  }

  *, *::before, *::after{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 10% 10%, rgba(80, 110, 200, 0.22), transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(217, 199, 163, 0.14), transparent 42%),
      radial-gradient(circle at 50% 82%, rgba(100, 70, 150, 0.16), transparent 52%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Noto Serif TC", "Shippori Mincho", "Songti TC", serif;
    line-height: 1.9;
    letter-spacing: 0.05em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* 星空点缀 */
  .stars{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
    background-image:
      radial-gradient(1.2px 1.2px at 20% 30%, rgba(255,255,255,0.70), transparent),
      radial-gradient(1.0px 1.0px at 70% 15%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1.4px 1.4px at 40% 65%, rgba(255,255,255,0.60), transparent),
      radial-gradient(1.0px 1.0px at 85% 55%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.1px 1.1px at 15% 80%, rgba(255,255,255,0.50), transparent),
      radial-gradient(1.0px 1.0px at 60% 90%, rgba(255,255,255,0.40), transparent),
      radial-gradient(1.3px 1.3px at 95% 35%, rgba(217,199,163,0.60), transparent),
      radial-gradient(1.0px 1.0px at 5% 50%, rgba(255,255,255,0.40), transparent);
    animation: twinkle 8s ease-in-out infinite alternate;
  }

  @keyframes twinkle{
    0%   { opacity: 0.40; }
    100% { opacity: 0.70; }
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: clamp(56px, 9vw, 88px) clamp(18px, 4vw, 28px) clamp(72px, 12vw, 110px);
  }

  /* ── Hero ── */
  .hero{
    position: relative;
    text-align: center;
    padding-bottom: clamp(36px, 6vw, 50px);
    border-bottom: 1px solid var(--line);
    margin-bottom: clamp(36px, 6vw, 52px);
  }

  .hero::before{
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 18px var(--accent-glow);
  }

  .eyebrow{
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: clamp(18px, 3vw, 24px);
  }

  h1{
    font-size: clamp(28px, 5.5vw, 46px);
    line-height: 1.28;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0 0 16px;
    color: #ffffff;
    text-shadow: 0 4px 28px rgba(0, 0, 0, 0.55);
  }

  .subtitle{
    font-family: "Inter", sans-serif;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin: 0;
  }

  .jp{
    margin: clamp(30px, 5vw, 42px) 0 20px;
    font-family: "Shippori Mincho", "Noto Serif TC", serif;
    font-size: clamp(17px, 2.8vw, 23px);
    line-height: 1.8;
    color: #e8e2d6;
    text-shadow: 0 0 24px rgba(217, 199, 163, 0.22);
  }

  .zh-title{
    font-size: clamp(15px, 2.4vw, 18px);
    line-height: 1.8;
    margin: 0 0 14px;
    color: var(--text-soft);
  }

  .edition{
    font-family: "Inter", sans-serif;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  blockquote{
    margin: clamp(30px, 5vw, 40px) auto 0;
    padding: 18px 22px;
    max-width: 620px;
    border-left: 2px solid var(--accent);
    background: linear-gradient(90deg, rgba(217, 199, 163, 0.09), transparent);
    color: #efe9dd;
    font-size: clamp(14px, 2vw, 15px);
    line-height: 1.85;
    text-align: left;
    border-radius: 0 10px 10px 0;
  }

  .flower{
    display: inline-block;
    margin-left: 0.3em;
    transform-origin: center bottom;
